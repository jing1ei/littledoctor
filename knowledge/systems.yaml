- id: neuro_sleep
  name: Sleep, Mood & Nervous System
  name_zh: 睡眠、情绪与神经
  order: 13
  essence: The upstream regulator of nearly every other system, and the least often measured.
  essence_zh: 几乎所有其他系统的上游调节者，也是最少被测量的一个。
  core:
  - sleep_duration
  - sleep_quality
  extended:
  - resting_hr
  - hrv
  - stress_score
  - phq9
  - gad7
  exams:
  - sleep_study
  maintenance:
  - Discuss how sleep, mood and anxiety affect daily function, how long changes have lasted, and available
    support. Questionnaire totals and wearable readings do not replace a conversation or establish a diagnosis.
  - Persistent insomnia can be assessed for CBT-I. If there are thoughts of self-harm or immediate danger,
    seek urgent local help; a total score cannot establish safety.
  maintenance_zh:
  - 讨论睡眠、情绪及焦虑如何影响日常功能、变化持续多久，以及可获得的支持；问卷总分及穿戴设备读数不能替代交流或确诊。
  - 持续失眠可评估是否适合失眠认知行为治疗。如有自伤想法或紧迫危险，应及时寻求当地紧急帮助；总分不能判断安全。
