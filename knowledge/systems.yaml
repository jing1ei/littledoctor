- id: liver
  name: Liver & Biliary
  name_zh: 肝脏与胆道
  order: 3
  essence: The metabolic clearing house; quietly reflects diet, alcohol, medication and visceral fat.
  essence_zh: 代谢的清算中心；安静地反映饮食、酒精、用药和内脏脂肪。
  core:
  - alt
  - ast
  - ggt
  extended:
  - alp
  - bilirubin_total
  - albumin
  - total_protein
  - platelets
  - fib4
  - ast_alt_ratio
  - hbsag
  - hbsab
  - anti_hcv
  exams:
  - abdominal_ultrasound
  - liver_elastography
  maintenance:
  - Use this record to prepare questions and agree on priorities with your clinician. Unrecorded tests
    are not automatically needed.
  - Choose sustainable food, movement and sleep habits that fit your health, resources and preferences;
    treatment and supplement decisions need individual review.
  maintenance_zh:
  - 用这份记录整理问题，并与医生共同确定优先事项。未记录的检查并非都需要补做。
  - 选择适合自身健康、资源及偏好的可持续饮食、活动和睡眠习惯；治疗与补充剂应个体化评估。
