version: 1
systems:
- id: metabolic
  name: Metabolic & Glycemic
  name_zh: 代谢与血糖
  order: 1
  essence: How your body handles fuel — sugar, insulin, weight, purines.
  essence_zh: 身体如何处理燃料——糖、胰岛素、体重、嘌呤。
  core:
  - glucose_fasting
  - hba1c
  - bmi
  extended:
  - insulin_fasting
  - homa_ir
  - uric_acid
  - waist
  - weight
  - height
  - glucose_2h
  - c_peptide
  exams: []
  maintenance:
  - Build meals around a varied mix of vegetables, fruit, whole grains and pulses; include suitable protein
    foods and favour unsaturated fats. Adapt choices for allergies, kidney disease, swallowing problems
    and access to food.
  - Discuss appetite, unintended weight change, food insecurity and supplement use. A laboratory result
    alone does not determine a restrictive diet or supplement dose.
  maintenance_zh:
  - 餐食可包括多样的蔬菜、水果、全谷物及豆类，搭配合适的蛋白质来源，优先不饱和脂肪；需按过敏、肾病、吞咽问题及食物可及性调整。
  - 讨论食欲、非主动体重变化、食物保障及补充剂使用；单项化验不能决定限制性饮食或补充剂剂量。
