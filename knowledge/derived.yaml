- id: stress_score
  name: Stress (self)
  name_zh: 压力自评
  system: neuro_sleep
  unit: /10
  decimals: 1
  aliases:
  - 压力自评
  - 压力评分
  - stress
  direction: high_bad
  tier: extended
  fresh_months: 6
  note: A questionnaire or device reading is not a diagnosis. Review function, duration, context and support
    needs. PHQ-9 total alone cannot assess self-harm risk; individual answers and direct assessment matter.
  note_zh: 问卷或设备读数不等于诊断，需评估功能、持续时间、背景及支持需求。PHQ-9总分不能单独评估自伤风险，需了解单项回答并直接评估。
